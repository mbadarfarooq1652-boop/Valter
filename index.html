    <script>
      // Compatibility fix for browser extensions attempting to assign to window.fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : originalFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Ignore if cannot redefine
        }

        // Filter out third-party browser extension exceptions from bubbling to the app
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
